<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elegir pantalla · UMBRAL · Portada animada · Edición oscura</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;font:16px/1.5 system-ui,sans-serif;background:#f7f5f1;color:#18253d}.panel{width:min(92vw,600px);padding:clamp(22px,7vw,54px)}.brand{font-size:13px;font-weight:850;letter-spacing:.2em;color:#e66f34}h1{font-size:clamp(32px,7vw,58px);letter-spacing:-.05em;line-height:1.03;margin:18px 0}p{color:#677080}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:28px}button{cursor:pointer;border:0;border-radius:12px;background:#173e7b;color:#fff;padding:18px;text-align:left;font-size:17px;font-weight:750;min-height:68px}button:hover,button:focus-visible{background:#ed713c}small{display:block;margin-top:32px;color:#77818d}</style></head><body><main class="panel"><div class="brand">PULSE · PUBLICACIÓN DIGITAL</div><h1 id="title"></h1><p>Elige cómo quieres ver esta revista.</p><div class="choices"><button type="button" data-device="desktop">Ordenador</button><button type="button" data-device="tabletH">Tablet horizontal</button><button type="button" data-device="tabletV">Tablet vertical</button><button type="button" data-device="mobile">Teléfono</button></div><small>Solo aparecen los formatos incluidos en la publicación.</small></main><script>document.getElementById('title').textContent="UMBRAL · Portada animada · Edición oscura";document.querySelectorAll('[data-device]').forEach(b=>b.addEventListener('click',()=>{location.href='revista.html?device='+encodeURIComponent(b.dataset.device)}));</script></body></html>
