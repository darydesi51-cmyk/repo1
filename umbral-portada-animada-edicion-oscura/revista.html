/* cruzada: sections as layers */

 if(layers[i])return layers[i];
 var L=el('div','rp-layer');L.style.display='none';L.dataset.u=i;
 var vs=makeFlow('v',units[i]);L.appendChild(vs);L._vs=vs;
 stage.appendChild(L);layers[i]=L;fitFlow(vs);return L;
}
function showUnit(i,instant){
 if(i<0||i>=units.length)return;
 var tr=instant?'none':(O.transition||'slide');var dir=i>=cur?1:-1;var old=layers[cur];var nw=getLayer(i);
 if(old===nw&&nw.classList.contains('cur')){afterNav();return}
 var dur=tr==='none'?0:450;
 nw.style.transition='none';nw.style.display='flex';nw.style.transform=tr==='slide'?'translateX('+(dir*100)+'%)':'none';nw.style.opacity=tr==='fade'?0:1;void nw.offsetWidth;
 var t='transform '+dur+'ms cubic-bezier(.2,.7,.2,1), opacity '+dur+'ms';
 nw.style.transition=t;nw.style.transform='none';nw.style.opacity=1;nw.classList.add('cur');
 if(old&&old!==nw){old.style.transition=t;if(tr==='slide')old.style.transform='translateX('+(-dir*100)+'%)';if(tr==='fade')old.style.opacity=0;old.classList.remove('cur');pageHidden(old);(function(o){setTimeout(function(){if(!o.classList.contains('cur'))o.style.display='none'},dur+30)})(old)}
 cur=i;attachObserver(nw._vs,nw._vs._items);curPage=units[i][0];
 afterNav();
}
/* continuous flow */
function buildFlow(){
 stage.innerHTML='';flow=makeFlow(nav==='horizontal'?'h':'v',P.pages.map(function(_,i){return i}));stage.appendChild(flow);vItems=flow._items;fitFlow(flow);attachObserver(flow,vItems);
 if(nav==='horizontal'){stage.appendChild(arrL);stage.appendChild(arrR);
  flow.addEventListener('wheel',function(ev){if(ev.target.closest('.rp-scroll,iframe'))return;if(Math.abs(ev.deltaY)>Math.abs(ev.deltaX)){flow.scrollLeft+=ev.deltaY;ev.preventDefault()}},{passive:false})}
}
function attachObserver(root,items){
 if(observer)observer.disconnect();
 var vis={};
 observer=new IntersectionObserver(function(entries){
  entries.forEach(function(en){var pi=+en.target.dataset.pi;
   if(en.intersectionRatio>=0.2&&!vis[pi]){vis[pi]=1;pageShown(en.target)}
   else if(en.intersectionRatio<0.02&&vis[pi]){vis[pi]=0;pageHidden(en.target)}
  });track();
 },{root:root,threshold:[0,0.02,0.2,0.5,0.8,1]});
 items.forEach(function(it){observer.observe(it)});
 var raf=0;function track(){var rr=root.getBoundingClientRect(),best=null,bv=-1;items.forEach(function(it){var r=it.getBoundingClientRect();var v=Math.max(0,Math.min(r.bottom,rr.bottom)-Math.max(r.top,rr.top))*Math.max(0,Math.min(r.right,rr.right)-Math.max(r.left,rr.left));if(v>bv){bv=v;best=it}});if(best&&+best.dataset.pi!==curPage){curPage=+best.dataset.pi;afterNav()}}
 root.addEventListener('scroll',function(){if(raf)return;raf=requestAnimationFrame(function(){raf=0;track()})},{passive:true});
}
/* api */
function goToPage(pi){
 pi=clamp(pi,0,P.pages.length-1);
 if(nav!=='cruzada'){var it=vItems[pi];if(it){if(nav==='horizontal')flow.scrollTo({left:it.offsetLeft,behavior:'smooth'});else flow.scrollTo({top:it.offsetTop,behavior:'smooth'})}return}
 var u=units.findIndex(function(x){return x.indexOf(pi)>=0});if(u<0)return;
 if(u!==cur||!layers[cur]||!layers[cur].classList.contains('cur'))showUnit(u);
 var L=layers[u];var it2=L._vs._items.find(function(x){return +x.dataset.pi===pi});if(it2)setTimeout(function(){L._vs.scrollTo({top:it2.offsetTop,behavior:'smooth'})},40);
}
function next(){if(nav!=='cruzada')goToPage(curPage+1);else showUnit(cur+1)}
function prev(){if(nav!=='cruzada')goToPage(curPage-1);else showUnit(cur-1)}
function afterNav(){
 if(ind)ind.textContent=(curPage+1)+' / '+P.pages.length;
 if(nav==='horizontal'){arrL.hidden=curPage<=0||O.arrows===false;arrR.hidden=curPage>=P.pages.length-1||O.arrows===false}
 if(nav==='cruzada'){arrL.hidden=cur<=0||O.arrows===false;arrR.hidden=cur>=units.length-1||O.arrows===false}
 try{history.replaceState(null,'','#p='+(curPage+1))}catch(_){}
 $('.rp-th',thumbs).forEach(function(t){t.classList.toggle('cur',(t._pis||[]).indexOf(curPage)>=0)});
}
function build(){
 closeDrawers();units=buildUnits();layers={};
 if(observer){observer.disconnect();observer=null}
 stage.innerHTML='';
 if(nav!=='cruzada'){var p0=curPage;buildFlow();curPage=0;afterNav();if(p0)setTimeout(function(){var it=vItems[p0];if(it){if(nav==='horizontal')flow.scrollLeft=it.offsetLeft;else flow.scrollTop=it.offsetTop}},60);return}
 stage.appendChild(arrL);stage.appendChild(arrR);
 var u=Math.max(0,units.findIndex(function(x){return x.indexOf(curPage)>=0}));cur=u;var keep=curPage;showUnit(u,true);
 if(keep!==units[u][0])setTimeout(function(){goToPage(keep)},60);
}
/* drawers */
function closeDrawers(){drawer.classList.remove('on');thumbs.classList.remove('on');shade.classList.remove('on')}
function mini(p,h){var s=h/H;var d=el('div','rp-mini');d.style.width=(W*s)+'px';d.style.height=h+'px';var pg=renderPage(p,{thumb:true});pg.style.transform='scale('+s+')';d.appendChild(pg);return d}
function openDrawer(kind){
 closeDrawers();var head=drawer.firstChild.firstChild,body=drawer.lastChild;body.innerHTML='';
 if(kind==='summary'){head.textContent='Sumario';
  P.pages.forEach(function(p,i){if(p.inSummary===false)return;var b=el('button','rp-sum');b.appendChild(el('span','n',String(i+1)));b.appendChild(mini(p,64));b.appendChild(el('span')).textContent=p.title||('Página '+(i+1));b.onclick=function(){closeDrawers();goToPage(i)};body.appendChild(b)});
 }else if(kind==='search'){head.textContent='Buscar';
  var inp=el('input','rp-in-search');inp.placeholder='Buscar en la publicación…';inp.type='search';body.appendChild(inp);var res=el('div');body.appendChild(res);
  var texts=P.pages.map(function(p){var t=document.createElement('div');return (p.objects||[]).filter(function(o){return o.kind==='text'}).map(function(o){t.innerHTML=o.text.html;return t.textContent}).concat(p.pdfText?[p.pdfText]:[]).join(' · ')});
  inp.oninput=function(){var q=inp.value.trim().toLowerCase();res.innerHTML='';if(q.length<2)return;var n=0;
   texts.forEach(function(t,i){var lo=t.toLowerCase(),k=lo.indexOf(q);while(k>=0&&n<80){var a=Math.max(0,k-40),s=t.slice(a,k),m=t.slice(k,k+q.length),z=t.slice(k+q.length,k+q.length+60);var b=el('button','rp-res');b.innerHTML='<small>Página '+(i+1)+'</small>';var sp=el('span');sp.appendChild(document.createTextNode((a?'…':'')+s));var bb=el('b');bb.textContent=m;sp.appendChild(bb);sp.appendChild(document.createTextNode(z+'…'));b.appendChild(sp);(function(pi){b.onclick=function(){closeDrawers();goToPage(pi)}})(i);res.appendChild(b);n++;k=lo.indexOf(q,k+q.length)}});
   if(!n)res.innerHTML='<p style="opacity:.6;font-size:13px;padding:8px">Sin resultados</p>'};
  setTimeout(function(){inp.focus()},300);
 }else if(kind==='share'){head.textContent='Compartir';
  var u=encodeURIComponent(location.href.split('#')[0]),t=encodeURIComponent(P.title||'');var g=el('div','rp-share');
  var links=[['Correo','mailto:?subject='+t+'&body='+u],['WhatsApp','https://wa.me/?text='+t+'%20'+u],['X','https://twitter.com/intent/tweet?text='+t+'&url='+u],['Facebook','https://www.facebook.com/sharer/sharer.php?u='+u],['LinkedIn','https://www.linkedin.com/sharing/share-offsite/?url='+u]];
  links.forEach(function(l){var a=el('a');a.textContent=l[0];a.href=l[1];a.target='_blank';a.rel='noopener';g.appendChild(a)});
  var cp=el('button');cp.textContent='Copiar enlace';cp.onclick=function(){(navigator.clipboard?navigator.clipboard.writeText(location.href):Promise.reject()).then(function(){cp.textContent='¡Copiado!'}).catch(function(){prompt('Copia el enlace:',location.href)})};g.appendChild(cp);
  if(navigator.share){var ns=el('button');ns.textContent='Más opciones…';ns.onclick=function(){navigator.share({title:P.title,url:location.href}).catch(function(){})};g.appendChild(ns)}
  body.appendChild(g);
 }
 drawer.classList.add('on');shade.classList.add('on');
}
function toggleThumbs(force){
 var on=force!=null?force:!thumbs.classList.contains('on');closeDrawers();if(!on)return;
 thumbs.innerHTML='';var us=P.pages.map(function(_,i){return [i]});
 us.forEach(function(u){var t=el('button','rp-th');t._pis=u;var row=el('div','rp-thp');u.forEach(function(pi){row.appendChild(mini(P.pages[pi],110))});t.appendChild(row);t.appendChild(el('span','',u.map(function(x){return x+1}).join('–')));t.onclick=function(){closeDrawers();goToPage(u[0])};thumbs.appendChild(t)});
 thumbs.classList.add('on');shade.classList.add('on');afterNav();
 var c=$('.rp-th.cur',thumbs);if(c)c.scrollIntoView({inline:'center',block:'nearest'});
}
function toggleFS(){var d=document;if(!d.fullscreenElement&&!d.webkitFullscreenElement){var r=d.documentElement;(r.requestFullscreen||r.webkitRequestFullscreen||function(){}).call(r)}else{(d.exitFullscreen||d.webkitExitFullscreen||function(){}).call(d)}}
/* input */
var swiped=false,sx=null;
stage.addEventListener('pointerdown',function(ev){if(nav!=='cruzada')return;if(ev.target.closest('.rp-car,.rp-scroll,.rp-pano,iframe,video,audio,.rp-arr'))return;sx={x:ev.clientX,y:ev.clientY}});
stage.addEventListener('pointerup',function(ev){if(!sx)return;var dx=ev.clientX-sx.x,dy=ev.clientY-sx.y;sx=null;
 var horiz=Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.2;
 if(horiz){swiped=true;setTimeout(function(){swiped=false},80);dx<0?next():prev()}});
document.addEventListener('keydown',function(ev){
 if(ev.target.matches&&ev.target.matches('input,textarea'))return;
 var top=pops[pops.length-1];
 if(ev.key==='Escape'){if(top)closePopup(top);else closeDrawers();return}
 if(top){if(top.keys)top.keys(ev.key);return}
 if(ev.key==='ArrowRight'||ev.key==='PageDown'){if(nav!=='vertical'||ev.key==='PageDown'){ev.preventDefault();next()}}
 else if(ev.key==='ArrowLeft'||ev.key==='PageUp'){if(nav!=='vertical'||ev.key==='PageUp'){ev.preventDefault();prev()}}
 else if(ev.key==='Home')goToPage(0);else if(ev.key==='End')goToPage(P.pages.length-1);
 else if(ev.key==='f'&&M.fullscreen!==false)toggleFS();
});
var rt=null;
addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){
 pops.forEach(function(r){if(r.pp)fitPopup(r)});
 if(nav!=='cruzada'){if(flow)fitFlow(flow);return}
 Object.keys(layers).forEach(function(k){fitFlow(layers[k]._vs)});
},120)});
/* start */
var hm=location.hash.match(/p=(\d+)/);curPage=hm?clamp((+hm[1])-1,0,P.pages.length-1):(window.__startPage?clamp(window.__startPage-1,0,P.pages.length-1):0);
if(!P.pages.length){stage.innerHTML='<p style="padding:40px;opacity:.6">Publicación vacía</p>'}else build();
window.RP={goToPage:goToPage,next:next,prev:prev,current:function(){return curPage},openPopup:function(id){closeAllPopups();openPopup({src:'design',popup:id})}};
})();

</script>
